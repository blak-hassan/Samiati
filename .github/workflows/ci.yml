name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# One job, cheapest check first: a type error fails in seconds instead of
# after a full browser run.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.18 is the first release that runs the TypeScript scripts without
          # a loader, which is what package.json asks for.
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install the browser Playwright needs
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
