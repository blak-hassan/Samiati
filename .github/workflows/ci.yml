name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# One job, cheapest check first: a type error fails in seconds instead of
# after a full browser run.
jobs:
  verify:
    # Pinned, not `ubuntu-latest`: the rolling image is now ubuntu-26.04, and
    # Playwright 1.56 has no browser build for it. `playwright install` fails
    # with "Playwright does not support chromium on ubuntu26.04-x64".
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # 22.18 is the first release that runs the TypeScript scripts without
          # a loader, which is what package.json asks for.
          node-version: 22.18.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install the browser Playwright needs
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run test:e2e
